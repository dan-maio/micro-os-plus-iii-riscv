# -----------------------------------------------------------------------------
# reset.cfg -- warm-reset the Milk-V Duo (CV1800B) from OpenOCD.
#
#     openocd -f openocd.cfg -f reset.cfg
#
# The Duo's header has no reset line, so the reset is requested the way the
# SoC's own software does it -- the RTC domain's warm-reset request, the
# sequence of the SDK's Linux restart handler
# (linux_5.10/drivers/power/reset/cvi-reboot.c) and U-Boot's
# cv_system_reset() (u-boot-2021.10/board/cvitek/cv180x/board.c):
#
#   REG_RTC_BASE      = 0x05026000   REG_RTC_CTRL_BASE = 0x05025000
#   1. RTC +0x3C            <- 1        prdata from the 32 kHz domain
#   2. RTC_CTRL +0x04       <- 0xAB18   RTC_CTRL0_UNLOCKKEY
#   3. RTC +0xCC            <- 1        RTC_EN_WARM_RST_REQ, read back until 1
#   4. RTC_CTRL +0x08       <- 0xFFFF0810  RTC_CTRL0: warm reset request (bit 4)
#
# The whole SoC then reboots: boot ROM -> SD card (minimal fip: BL2 brings up
# clocks, DDR, UART4 and the JTAG pinmux) -> OpenSBI parks the hart. JTAG is
# lost during that time (TMS/TCK are on the UART0 pads until BL2 muxes them),
# so this session ends with `shutdown`; the next OpenOCD session attaches to
# the freshly booted board. Allow ~3-5 s (hw-all.sh does).
#
# The writes go through the hart (riscv set_mem_access progbuf, openocd.cfg),
# in machine mode, so the hart is halted first.
# -----------------------------------------------------------------------------

proc cv1800b_warm_reset {} {
  halt
  # The parked payload runs in S-mode; the RTC registers want M-mode.
  reg priv 3

  mww 0x0502603C 0x00000001
  mww 0x05025004 0x0000AB18
  mww 0x050260CC 0x00000001

  # Read back until the request enable sticks (the SDK polls the same way).
  # read_memory is a target command (OpenOCD >= 0.12); if it is missing or
  # the read fails, go ahead -- the request is what matters.
  set ok 0
  for {set i 0} {$i < 100} {incr i} {
    if {[catch {set v [lindex [read_memory 0x050260CC 32 1] 0]}]} {
      break
    }
    if {$v == 1} {
      set ok 1
      break
    }
  }
  if {!$ok} {
    echo "reset.cfg: RTC_EN_WARM_RST_REQ did not read back 1 -- requesting anyway"
  }

  echo "reset.cfg: warm reset requested (RTC_CTRL0)"
  # This access may not complete: the SoC is already resetting.
  catch {mww 0x05025008 0xFFFF0810}
}

init
cv1800b_warm_reset
shutdown
